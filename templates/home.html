<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Price Prediction</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            display: block;
            width: 220px;
            padding: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        h2 {
            margin-top: 30px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Car Price Prediction</h1>

<form action="{{ url_for('predict_datapoint') }}" method="post">

    <input type="text" name="Brand" placeholder="Brand" required>

    <input type="text" name="Model" placeholder="Model" required>

    <input type="text" name="Seller_Type" placeholder="Seller Type" required>

    <input type="text" name="Owner" placeholder="Owner" required>

    <input type="text" name="KM_Driven" placeholder="KM Driven" required>

    <input type="text" name="Ex_Showroom_Price" placeholder="Ex Showroom Price" required>

    <button type="submit">Predict</button>

</form>

{% if result is not none %}
    <h2>THE predicted car price is {{ results }}</h2>
{% endif %}

</body>
</html>
